name: Duely — Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at 9:00 AM UTC
    - cron: '0 9 */3 * *'
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          
          echo "Supabase response code: $response"
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 400 ] || [ "$response" -eq 401 ]; then
            echo "✅ Supabase is alive (response: $response)"
          else
            echo "❌ Unexpected response: $response"
            exit 1
          fi

      - name: Ping duely.tech to keep Vercel warm
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://duely.tech")
          echo "duely.tech response code: $response"
          
          if [ "$response" -eq 200 ]; then
            echo "✅ duely.tech is alive"
          else
            echo "⚠️ duely.tech returned: $response"
          fi

      - name: Run a lightweight Supabase query
        run: |
          curl -s \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/organizations?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            | echo "Query complete — Supabase DB is active"