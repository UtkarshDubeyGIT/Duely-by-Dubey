        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Login Container -->
<main class="w-full max-w-[420px]">
<!-- Logo Header -->
<div class="flex flex-col items-center mb-8">
<img src="{{DATA:IMAGE:IMAGE_5}}" alt="Duely Logo" class="w-[120px] h-auto mb-2">
<p class="font-body-md text-body-md text-on-surface-variant">Log in to your account</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-border-subtle rounded p-8 w-full">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface uppercase tracking-wider" for="email">Email Address</label>
<input class="w-full px-4 py-3 bg-surface border border-border-subtle rounded font-data-mono text-data-mono text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-label-caps text-on-surface uppercase tracking-wider" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-on-secondary-fixed-variant transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full px-4 py-3 bg-surface border border-border-subtle rounded font-data-mono text-data-mono text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<!-- Submit Button -->
<button class="w-full py-3 px-6 bg-primary text-on-primary rounded-full font-body-md text-body-md font-semibold hover:scale-[0.98] transition-transform flex items-center justify-center gap-2" type="submit">
                    Continue
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="my-8 flex items-center">
<div class="flex-grow border-t border-border-subtle"></div>
<span class="px-4 bg-surface-container-lowest font-body-sm text-body-sm text-outline">or</span>
<div class="flex-grow border-t border-border-subtle"></div>
</div>
<!-- Google SSO -->
<button class="w-full py-3 px-6 bg-surface-container-lowest border border-border-subtle text-on-surface rounded-full font-body-md text-body-md font-semibold hover:bg-surface-container transition-colors flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="font-medium text-secondary hover:text-on-secondary-fixed-variant hover:underline transition-colors" href="#">Sign up</a>
</p>
</div>

</body></html>
