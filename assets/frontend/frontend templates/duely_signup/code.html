<style data-stitch-cursor=""></style><style data-stitch-scroll-lock=""></style></head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md">
<div class="w-full max-w-md">
<!-- Logo -->
<div class="text-center mb-8">
<h1 class="font-display-xl text-display-xl text-primary md:text-[48px] md:leading-[56px]"><img src="{{DATA:IMAGE:IMAGE_5}}" alt="Duely Logo" class="h-12 md:h-16 mx-auto object-contain"></h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Create your account</p>
</div>
<!-- Signup Card -->
<div class="bg-surface-container-lowest border border-border-subtle rounded p-6 md:p-8 shadow-sm">
<form action="#" class="space-y-6" method="POST">
<!-- Business Name -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="business_name">Business name</label>
<input class="w-full bg-surface-bright border border-border-subtle rounded-md px-4 py-3 font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="business_name" name="business_name" placeholder="Acme Corp" required="" type="text">
</div>
<!-- Your Name -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="full_name">Your name</label>
<input class="w-full bg-surface-bright border border-border-subtle rounded-md px-4 py-3 font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="full_name" name="full_name" placeholder="Jane Doe" required="" type="text">
</div>
<!-- Email -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="email">Email address</label>
<input class="w-full bg-surface-bright border border-border-subtle rounded-md px-4 py-3 font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
<!-- Password -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="password">Password</label>
<input class="w-full bg-surface-bright border border-border-subtle rounded-md px-4 py-3 font-data-mono text-data-mono text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-bold py-3 px-6 rounded-full hover:scale-[0.98] transition-transform flex justify-center items-center" type="submit">
                    Create account
                </button>
</form>
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? <a class="text-secondary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-outline">
                By creating an account, you agree to our <a class="underline hover:text-on-surface transition-colors" href="#">Terms of Service</a> and <a class="underline hover:text-on-surface transition-colors" href="#">Privacy Policy</a>.
            </p>
</div>
</div>


</body></html>
